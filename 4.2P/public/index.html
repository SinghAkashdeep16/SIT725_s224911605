<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIT725 3.2P - Plant Catalog</title>
  <meta name="description" content="SIT725 3.2P Plant Catalog app">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav>
    <div class="nav-wrapper navbar-size">
      <a href="#!" class="brand-logo left">
        <i class="material-icons left">local_florist</i>Plant Catalog
      </a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a target="_blank" href="https://github.com/SinghAkashdeep16">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="main-body">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 id="heading">Welcome to the Plant Catalog</h1>
          
        </div>
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn add-plant-button modal-trigger" id="addPlantButton" data-target="modal1">
            <i class="material-icons left">add</i>Add New Plant
          </a>
        </div>
      </div>

      <div class="row" id="card-section">
        <!-- Cards are injected here dynamically by js/scripts.js -->
      </div>
    </div>

    <!-- Modal Structure -->
    <div id="modal1" class="modal modal-fixed-footer">
      <div class="row modal-content">
        <h4>Add a New Plant</h4>
        <form class="col s12">
          <div class="row">
            <div class="input-field col s6">
              <input placeholder="e.g. Peace Lily" id="plant_name" type="text" class="validate">
              <label for="plant_name">Plant Name</label>
            </div>
            <div class="input-field col s6">
              <select id="plant_category">
                <option value="Indoor" selected>Indoor</option>
                <option value="Outdoor">Outdoor</option>
                <option value="Succulent">Succulent</option>
                <option value="Herb">Herb</option>
              </select>
              <label>Category</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <textarea id="plant_description" class="materialize-textarea validate"></textarea>
              <label for="plant_description">Description</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <input id="plant_image" type="text" class="validate" placeholder="/images/peace-lily.jpg">
              <label for="plant_image">Image path</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <a class="waves-effect waves-light btn modal-close" id="plantFormSubmit">Add Plant</a>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
